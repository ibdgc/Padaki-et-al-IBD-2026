name: Build and Push Containers

on:
  push:
    branches: [ main ]
    paths:
      - 'containers/**'
      - 'workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'containers/**'
      - 'workflows/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ${{ github.repository }}/bge-analysis
  SINGULARITY_IMAGE_NAME: ${{ github.repository }}/bge-analysis-sif

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PA_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./containers/docker/bge-analysis/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GITHUB_REPO=https://github.com/${{ github.repository }}

  build-and-push-singularity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Singularity
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.8.3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PA_TOKEN }}

      - name: Build Singularity image
        run: |
          # Install Singularity Remote Builder
          pip install singularity-hpc
      
          # Configure remote builder
          singularity remote login --tokenfile ${{ secrets.SYLABS_TOKEN }}
      
          # Build using remote builder
          singularity build --remote bge-analysis.sif containers/singularity/bge-analysis.def

      - name: Push Singularity image to GHCR
        run: |
          VERSION=$(git rev-parse --short HEAD)

          # Push with specific version tag
          singularity push bge-analysis.sif oras://${{ env.REGISTRY }}/${{ env.SINGULARITY_IMAGE_NAME }}:${VERSION}

          # Push as latest if on main branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            singularity push bge-analysis.sif oras://${{ env.REGISTRY }}/${{ env.SINGULARITY_IMAGE_NAME }}:latest
          fi
